<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>REALITY//ENGINE — Fluid Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#030711;color:#eaf4ff;font:14px system-ui}canvas,video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{visibility:hidden}canvas{touch-action:none}header,footer{position:fixed;left:0;right:0;padding:16px;background:#07101bd9}header{top:0;pointer-events:none}footer{bottom:0;padding-bottom:max(16px,env(safe-area-inset-bottom))}h1{font-size:20px;letter-spacing:3px;margin:0}small{color:#eab85a}button,select{background:#12263c;color:white;border:1px solid #517da9;border-radius:8px;padding:12px;font:inherit}label{display:inline-flex;align-items:center;gap:6px;margin:6px}input{max-width:100px}</style><video id="video" muted playsinline></video><canvas id="screen" tabindex="0" aria-label="Interactive fluid camera"></canvas><header><small>CINEMATIC / EXPERIMENTAL</small><h1>REALITY//ENGINE</h1><p id="status" role="status">Start camera or enter fluid lab</p><span id="stats"></span></header><footer><button id="start">Camera</button> <button id="lab">Fluid lab</button> <button id="flip">Flip</button> <button id="stop">Stop</button> <select id="mode"><option>Smoke</option><option>Plasma</option><option>Light</option><option>Normal</option><option>Gravity</option><option>Lightning</option><option>Phantom (motion)</option><option>Neon</option><option>Sketch</option><option>ASCENSION</option><option>PHANTOM</option><option>GENESIS</option></select><label>Force <input id="power" type="range" min="0.2" max="2" step=".1" value="1"></label><label>Decay <input id="decay" type="range" min=".3" max="4" step=".1" value="1.5"></label><label><input id="quiet" type="checkbox">Reduced motion</label></footer><script type="module" src="./engine.mjs?v=cinematic1"></script></html>
