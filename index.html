<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REALITY//ENGINE — FIRST CONTACT</title><style> *{box-sizing:border-box}body{margin:0;background:#050914;color:#e6f5ff;font:16px system-ui}main{max-width:1000px;margin:auto;padding:18px}h1{font-size:clamp(22px,5vw,42px);letter-spacing:.08em;margin:0}small{color:#a8c8df}canvas{width:100%;height: min(55vh,480px);display:block;border:1px solid #52758e;border-radius:16px;touch-action:none;background:#030711}button,select,input{font:inherit}button,select{background:#13283e;color:white;border:1px solid #80b8d9;border-radius:8px;padding:12px;margin:4px}button:focus-visible,canvas:focus-visible,select:focus-visible{outline:3px solid #ffcf65}label{display:inline-block;margin:8px}#status{min-height:3em} </style><main><small>DIGNITYTECH / EXPERIMENTAL BUILD 0.1</small><h1>REALITY//ENGINE</h1><p>FIRST CONTACT — <strong id="stage">AWAKEN</strong></p><canvas id="world" tabindex="0" aria-label="Energy field. Arrow keys move, Space or Enter activates."></canvas><p id="status" aria-live="polite">Move or touch the field. Activate to awaken the entity.</p><button id="act">Activate / advance</button><button id="reset">Restart</button><label>Effect <select id="effect"><option>Plasma</option><option>Gravity</option><option>Smoke</option><option>Light</option></select></label><label>Sensitivity <input id="sensitivity" type="range" min="1" max="5" step=".25" value="1"></label><label><input id="reduce" type="checkbox"> Reduced motion</label><div id="choices" hidden><button data-end="Contained">Contain</button><button data-end="Transformed">Transform</button><button data-end="Released">Release</button></div><p><small>Touch, pointer or keyboard. Camera tracking is not implemented in this build. No audio or network requests from the experience.</small></p></main><script type="module" src="./game.mjs"></script></html>
