name: PRO validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/sha.txt
          for f in candidate-pro/*.mjs; do node --check "$f"; done
          node --test candidate-pro/*.test.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > evidence/http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']});
          const report=[],errors=[];
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},permissions:['camera']});
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.addInitScript(()=>{addEventListener('unhandledrejection',e=>console.error(String(e.reason)));addEventListener('webglcontextlost',()=>console.error('WebGL context lost'),true)});
            await page.goto('http://localhost:8765/candidate-pro/?validate=1');
            const names=await page.locator('#mode option').allTextContents();
            await page.locator('#start').click();
            await page.waitForTimeout(3500);
            const sample=()=>page.evaluate(()=>{const v=document.querySelector('video'),c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');if(v.readyState>=2)x.drawImage(v,0,0,16,16);return {camera:Array.from(x.getImageData(0,0,16,16).data),ready:v.readyState,w:v.videoWidth,h:v.videoHeight,active:v.srcObject?.getVideoTracks().some(t=>t.readyState==='live'),render:window.proFrame,status:document.querySelector('#status').textContent}});
            for(const [i,name] of names.entries()){
              const before=errors.length;let result={name,index:i};
              try{
                await page.locator('#mode').evaluate((el,i)=>{el.selectedIndex=i;el.dispatchEvent(new Event('change'))},i);
                await page.waitForTimeout(600);
                const a=await sample();await page.waitForTimeout(900);const b=await sample();
                result={...result,route:b.render?.route,implementation:b.render?.implementation,camera:b.active&&b.ready>=2&&b.w>0&&b.h>0,cameraChanges:JSON.stringify(a.camera)!==JSON.stringify(b.camera),renderChanges:JSON.stringify(a.render?.pixels)!==JSON.stringify(b.render?.pixels),nonblack:b.render?.pixels.some((v,i)=>i%4!==3&&v>8),gpu:b.render?.error===0&&!b.render?.lost,frames:b.render?.frame>a.render?.frame,status:b.status};
                result.pass=result.route===i&&result.implementation===name&&result.camera&&result.cameraChanges&&result.renderChanges&&result.nonblack&&result.gpu&&result.frames&&errors.length===before;
              }catch(e){result.error=e.message;result.pass=false}
              try{await page.screenshot({path:'evidence/'+name+'.png'})}catch(e){result.pass=false;result.screenshotError=e.message}
              report.push(result);
            }
            await page.locator('#advanced').click();
            await page.getByRole('button',{name:'Particle overlay',exact:true}).click();
            let babylon=false;try{await page.waitForFunction(()=>window.proBabylonFrames>2,{},{timeout:60000});babylon=true}catch{}
            report.push({name:'Babylon runtime',pass:babylon});
            await page.locator('#stop').click();
            report.push({name:'Camera stop',pass:await page.locator('video').evaluate(v=>!v.srcObject)});
          }finally{fs.writeFileSync('evidence/report.json',JSON.stringify({report,errors},null,2));await browser.close()}
          if(!report.length||report.some(r=>!r.pass)||errors.length)process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-preview-evidence
          path: evidence/
