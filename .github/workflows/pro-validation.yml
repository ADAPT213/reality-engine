name: PRO validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for f in candidate-pro/*.mjs; do node --check "$f"; done
          node --test candidate-pro/*.test.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/pro-http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']});
          try {
            const page=await browser.newPage({viewport:{width:390,height:844},permissions:['camera']});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://localhost:8765/candidate-pro/');
            await page.locator('#start').click();
            await page.waitForTimeout(3500);
            const status=await page.locator('#status').innerText();
            console.log(status);
            if(!/GPU/i.test(status)||/fallback|error|unavailable/i.test(status))throw Error(status);
            for(let i=0;i<12;i++){await page.locator('#mode').evaluate((el,i)=>{el.selectedIndex=i;el.dispatchEvent(new Event('change'))},i);await page.waitForTimeout(250);}
            await page.screenshot({path:'pro-preview.png'});
            if(errors.length)throw Error(errors.join('\n'));
          } finally {await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-preview
          path: |
            candidate-pro/
            pro-preview.png
